name: Release macOS app

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v0[0-9]+.*'
      - '!v*.0[0-9]+.*'
      - '!v*.*.0[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.created && !github.event.deleted
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build the unsigned universal app
        shell: bash
        run: |
          xcodebuild -project MintPlayer.xcodeproj -scheme MintPlayer \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MintPlayerBuild" \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MINTPLAYER_RELEASE_TAG="$GITHUB_REF_NAME" build

      - name: Verify and package the app
        shell: bash
        run: |
          app="$RUNNER_TEMP/MintPlayerBuild/Build/Products/Release/Mint Player.app"
          plist="$app/Contents/Info.plist"
          version=$(plutil -extract MintDisplayVersion raw -o - "$plist")
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The app version does not match the release tag."
            exit 1
          fi
          executable=$(plutil -extract CFBundleExecutable raw -o - "$plist")
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/$executable"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/mintplayer-mcp"

          staging_dir=$(mktemp -d "$RUNNER_TEMP/mintplayer-dmg.XXXXXXXX")
          trap 'rm -rf "$staging_dir"' EXIT
          ditto "$app" "$staging_dir/Mint Player.app"
          ln -s /Applications "$staging_dir/Applications"
          dmg="$RUNNER_TEMP/MintPlayer-$GITHUB_REF_NAME-macOS.dmg"
          hdiutil create -srcfolder "$staging_dir" -volname "Mint Player" -format UDZO "$dmg"
          hdiutil verify "$dmg"

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dmg="$RUNNER_TEMP/MintPlayer-$GITHUB_REF_NAME-macOS.dmg"
          if release=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets); then
            if ! jq -e --arg name "${dmg##*/}" \
                'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' \
                <<< "$release" > /dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
            fi
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
